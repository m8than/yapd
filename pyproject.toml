[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatterbox-flash"
version = "0.1.0"
description = "Chatterbox-Flash: prior-calibrated block-diffusion zero-shot TTS, extending Chatterbox-TTS with a parallel masked decoder."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Resemble AI" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # T3 / S3Gen / VoiceEncoder / EnTokenizer come from chatterbox-tts. Note that
    # chatterbox-tts 0.1.7 hard-pins ``torch==2.6.0``, ``torchaudio==2.6.0``,
    # ``transformers==5.2.0``, ``librosa==0.11.0`` and ``safetensors==0.5.3``.
    # We deliberately leave those ranges loose here and let the chatterbox-tts
    # solve drive the install — otherwise uv flips them back-and-forth between
    # each invocation.
    "chatterbox-tts>=0.1.7",
    "torch>=2.6",
    "torchaudio>=2.6",
    "transformers>=4.46",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "numpy>=1.24",
    "tqdm>=4.66",
    "soundfile>=0.12",
    "librosa>=0.10",
    "scipy>=1.11",
    "regex",
    "inflect>=7.0",
    "Unidecode>=1.3",
    # Used by the top-level ``synthesize.py`` CLI to parse YAML configs in
    # ``configs/`` (best / best_no_early_dec / fast). The library itself
    # does not import PyYAML.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# FlashInfer kernels (required for batched / CUDA-graph inference).
# Install matching your CUDA build: pip install flashinfer-python
flashinfer = ["flashinfer-python>=0.2"]

# Apple Silicon (Mac) native Metal backend. Pulls in mlx + mlx-lm; the
# mlx-lm LLaMA implementation is used as the backbone with our custom
# inputs_embeds bypass. CPU/GPU paths do not import these.
mlx = [
    "mlx>=0.13; sys_platform == 'darwin'",
    "mlx-lm>=0.10; sys_platform == 'darwin'",
]

# Evaluation suite (SIM-o / WER / UTMOS) via the OmniVoice pip package.
eval = [
    "omnivoice>=0.1.5",
    # omnivoice's WER eval imports the legacy ``jiwer.compute_measures``, which
    # was removed in jiwer 4.0. Cap below 4 so the import keeps working.
    "jiwer>=3.0,<4",
    "zhon>=2.0",
    "whisper-normalizer>=0.0.10",
    # omnivoice's SIM-o (speaker similarity) loads the WavLM-large upstream via
    # torch.hub, whose hubconf imports ``s3prl`` (s3prl.util.download +
    # s3prl.upstream.wavlm.expert). omnivoice does not declare it, so pull it in
    # here — otherwise Stage 2/3 SIM-o crashes with ModuleNotFoundError: s3prl.
    "s3prl>=0.4",
]

[project.urls]
Homepage = "https://github.com/resemble-ai/chatterbox-flash"
Repository = "https://github.com/resemble-ai/chatterbox-flash"

[tool.setuptools.packages.find]
where = ["."]
include = ["chatterbox_flash*"]

[tool.setuptools.package-data]
chatterbox_flash = ["py.typed"]

# ----------------------------------------------------------------------------
# uv-specific configuration
# ----------------------------------------------------------------------------
#
# ``chatterbox-tts==0.1.7`` hard-pins ``torch==2.6.0`` / ``torchaudio==2.6.0`` /
# ``transformers==5.2.0``, but most modern wheels installed alongside it
# (``torchvision``, ``xformers``, ``flash-attn``, ``flashinfer-python``) ship
# only torch-2.7 ABI binaries. Letting uv honour the chatterbox-tts pin causes
# a cascade of ABI mismatches: ``torchvision::nms does not exist``,
# ``flash_attn_2_cuda.so: undefined symbol``, etc.
#
# We therefore override the upper-stream pins to ``>=2.7`` for the install
# itself. The chatterbox-tts code paths we use (T3 / S3Gen / VE / EnTokenizer)
# work correctly against torch 2.7 — only the install-time metadata is stale.
[tool.uv]
override-dependencies = [
    # Pin to the 2.7.x ABI that the rest of the wheel ecosystem (torchvision,
    # xformers, flash-attn, flashinfer-python) currently ships matched binaries
    # against. Bumping the upper bound requires re-checking those wheels.
    "torch>=2.7,<2.8",
    "torchaudio>=2.7,<2.8",
    "torchvision>=0.22,<0.23",
    "transformers>=4.46",
]
